  #     - postgres_data:/var/lib/postgresql/data

  app:
    image: fastify-auth:latest
    container_name: fastify_auth_app
    restart: always
    env_file:
      - .env.production
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

volumes:
  postgres_data:
